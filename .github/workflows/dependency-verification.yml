name: Generar verificación de dependencias

# Ejecutar a mano UNA vez (y cada vez que cambien versiones). Genera
# gradle/verification-metadata.xml con las sumas SHA-256 de todas las dependencias.
# Revísalo y súbelo al repo: desde ese momento Gradle rechaza cualquier artefacto cuya suma
# no coincida. (Confianza en el primer uso: revisar que las versiones sean las esperadas.)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Generar certificado TLS local de pruebas
        run: bash scripts/generate-test-tls.sh
      - name: Generar
        run: bash ./gradlew --no-daemon --write-verification-metadata sha256 help testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
          if-no-files-found: error
