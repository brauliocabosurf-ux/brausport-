org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Compatibilidad con el plugin Kotlin 2.3.21 existente durante la actualización a AGP 9.1.1.
android.builtInKotlin=false
android.newDsl=false

# Huella SHA-256 del certificado de firma de Release (no es secreta). Si la llave usada no
# coincide, el build de Release falla: la tele solo acepta actualizaciones con la misma firma.
brau.expectedCertSha256=8f8cea3cd07feb4bc65700347d2a8bc4df0218439f682c59ccdaa367f70194b9

# HTTP en claro: hosts EXACTOS separados por coma. Vacío = solo HTTPS.
# Excepción aceptada por el dueño (25-oct-2026) SOLO para la fuente actual. No autoriza HTTP
# global, degradaciones HTTPS → HTTP, destinos privados ni desactivar TLS. Ver SECURITY.md §2.
brau.cleartextHosts=108.175.13.7
